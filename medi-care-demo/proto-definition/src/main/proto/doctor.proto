syntax="proto3";

option java_multiple_files = true;
option java_package = "org.jade.platform.proto.definition";

service DoctorService {
  rpc GetDoctorDetail (DoctorDetailsRequest) returns (DoctorResponse);
  rpc GetDoctorDetailWithEmail (DoctorDetailsEmailRequest) returns (DoctorResponse);
}

message DoctorDetailsRequest {
  int32 id = 1;
}

message DoctorDetailsEmailRequest {
  string email = 1;
}

message DoctorResponse {
  string firstName = 1;
  string lastName = 2;
  string email = 3;
  string phone = 4;
  string location = 5;
  string centerName = 6;
  string specialty = 7;
}