security:
  api-key: ${API_KEY:84d6ffff-9e87-4112-858b-debe5db19481}
  admin-api-key: admin-secret-key
springdoc:
  server-url: http://localhost:8080

spring:
  security:
    user:
      name: spring
      password: spring
  data:
    redis:
      host: localhost
      port: 6379


rate:
  limit:
    capacity: 10
    durationInMinutes: 1
    noOfTokens: 1


logging:
  level:
    web: TRACE
    org.springframework.web: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
